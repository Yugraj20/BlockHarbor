name: Build & Release BlockHarbor (Windows)

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress

      - name: Install Frontend Dependencies
        shell: bash
        run: |
          cd frontend
          npm install

      - name: Build Frontend
        shell: bash
        run: |
          cd frontend
          npm run build

      - name: Generate VFS from Frontend
        shell: bash
        run: |
          node scripts/generate-vfs.js

      - name: Install Backend Dependencies
        shell: bash
        run: |
          cd backend
          npm install

      - name: Run Backend Unit Tests
        shell: bash
        run: |
          cd backend
          bun test src/modules/playit/playit.service.spec.ts

      - name: Build Backend JS Bundle
        shell: bash
        run: |
          cd backend
          npm run build
          cp ../shared/vfs.js ./dist/shared/vfs.js

      - name: Compile Standalone Backend Executable
        shell: bash
        run: |
          bun run scripts/build.ts -f -b --platform win

      - name: Build & Publish Desktop Native Host
        shell: powershell
        run: |
          dotnet publish desktop/BlockHarbor.Desktop.csproj -c Release -r win-x64 --self-contained true -o dist/desktop
          Copy-Item dist/BlockHarbor-Backend.exe dist/desktop/BlockHarbor-Backend.exe -Force
          Copy-Item desktop/app.ico dist/desktop/app.ico -Force

      - name: Compile Inno Setup Installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" scripts/installer.iss

      - name: Package Portable ZIP & Compute Hashes
        shell: powershell
        run: |
          Compress-Archive -Path "dist\desktop\*" -DestinationPath "dist\release\BlockHarbor-Portable-x64.zip" -Force
          $hashes = Get-ChildItem -Path dist\release -Filter "BlockHarbor*" | ForEach-Object {
              $h = Get-FileHash -Path $_.FullName -Algorithm SHA256
              "$($h.Hash.ToLower())  $($_.Name)"
          }
          $hashes | Out-File -FilePath dist\release\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\release\SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlockHarbor-Windows-Binaries
          path: |
            dist/release/BlockHarbor-Setup-x64.exe
            dist/release/BlockHarbor-Portable-x64.zip
            dist/release/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/BlockHarbor-Setup-x64.exe
            dist/release/BlockHarbor-Portable-x64.zip
            dist/release/SHA256SUMS.txt
          generate_release_notes: true
